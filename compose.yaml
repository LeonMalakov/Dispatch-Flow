services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatchflow}
      POSTGRES_USER: ${POSTGRES_USER:-dispatchflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  lgtm:
    image: grafana/otel-lgtm:0.38.1
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm_data:/data
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dispatchflow.yaml:ro
      - ./observability/grafana/dispatchflow-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/dispatchflow/dispatchflow-overview.json:ro

volumes:
  postgres_data:
  lgtm_data:
